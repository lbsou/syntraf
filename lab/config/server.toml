# Config du serveur SYNTRAF du lab. Les ${...} sont remplacés par entrypoint.sh.
# Les réglages du trafic viennent d'un profil : c'est lui qu'on modifie (page Profiles) pour changer le débit.
[[IPERF3_PROFILE]]
UID = "LAB_PROFILE"
DESCRIPTION = "Lab traffic: 100 Kbps per flow, 218-byte packets"
BANDWIDTH = "100K"
DSCP = "0"
PACKET_SIZE = "218"
INTERVAL = "1"

[[MESH_GROUP]]
UID = "LAB_MESH"
IPERF3_PROFILE = "LAB_PROFILE"

[[SERVER_CLIENT]]
UID = "LAB_C1"
IP_ADDRESS = "172.30.0.31"
MESH_GROUP_UID_LIST = ["LAB_MESH"]

[[SERVER_CLIENT]]
UID = "LAB_C2"
IP_ADDRESS = "172.30.0.32"
MESH_GROUP_UID_LIST = ["LAB_MESH"]

[[SERVER_CLIENT]]
UID = "LAB_C3"
IP_ADDRESS = "0.0.0.0"
MESH_GROUP_UID_LIST = ["LAB_MESH"]

[[SERVER_CLIENT]]
UID = "LAB_C4"
IP_ADDRESS = "0.0.0.0"
MESH_GROUP_UID_LIST = ["LAB_MESH"]

[[DATABASE]]
DB_UID = "VM_LAB"
DB_ENGINE = "VictoriaMetrics"
DB_SERVER = "172.30.0.10"
DB_PORT = "8428"
DB_SERVER_USE_SSL = false

[GLOBAL]
IPERF3_BINARY_PATH = "/usr/local/bin/iperf3"
LOG_TO = "all"
LOG_LEVEL = "INFO"
LOG_MAX_SIZE_PER_FILE_MB = "10"
LOG_FILE_TO_KEEP = "1"
WATCHDOG_CHECK_RATE = "2"

[SERVER]
BIND_ADDRESS = "0.0.0.0"
SERVER_PORT = "6531"

[SERVER.TOKEN]
2026-11-20 = "${LAB_TOKEN}"
