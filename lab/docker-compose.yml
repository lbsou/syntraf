# Lab de robustesse SYNTRAF. Piloter avec : python lab/labctl.py <commande>
name: syntraf-lab

x-syntraf: &syntraf
  image: syntraf-lab:latest
  env_file: config/lab.env
  init: true
  restart: "no"
  cap_add: [NET_ADMIN]
  mem_limit: 192m
  # le script du dépôt (et non la copie figée dans l'image) : il évolue sans reconstruire l'image
  entrypoint: ["sh", "/src/lab/docker/entrypoint.sh"]
  volumes:
    - ../:/src:ro

x-client-depends: &client-depends
  depends_on:
    server:
      condition: service_started

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VM_VERSION}
    container_name: syntraf-lab-victoriametrics
    restart: "no"
    init: true
    mem_limit: 256m
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -search.latencyOffset=0s
      - -memory.allowedPercent=60
    ports:
      - "127.0.0.1:${VM_HOST_PORT}:8428"
    volumes:
      - vm-data:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      syntraf_lab:
        ipv4_address: 172.30.0.10

  server:
    <<: *syntraf
    build:
      context: ..
      dockerfile: lab/docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        IPERF3_SOURCE: ${IPERF3_SOURCE}
        IPERF3_REF: ${IPERF3_REF}
        IPERF3_FORK_REPO: ${IPERF3_FORK_REPO}
        IPERF3_FORK_BRANCH: ${IPERF3_FORK_BRANCH}
    container_name: syntraf-lab-server
    environment:
      ROLE: server
    volumes:
      - ../:/src:ro
      - ./reports/logs/server:/logs
      - server-crypto:/app/crypto
    ports:
      - "127.0.0.1:${WEBUI_HOST_PORT}:5000"
    depends_on:
      victoriametrics:
        condition: service_healthy
    networks:
      syntraf_lab:
        ipv4_address: 172.30.0.20

  c1:
    <<: [*syntraf, *client-depends]
    container_name: syntraf-lab-c1
    environment: {ROLE: client, CLIENT_UID: LAB_C1}
    volumes: ["../:/src:ro", "./reports/logs/c1:/logs", "c1-crypto:/app/crypto"]
    networks: {syntraf_lab: {ipv4_address: 172.30.0.31}}

  c2:
    <<: [*syntraf, *client-depends]
    container_name: syntraf-lab-c2
    environment: {ROLE: client, CLIENT_UID: LAB_C2}
    volumes: ["../:/src:ro", "./reports/logs/c2:/logs", "c2-crypto:/app/crypto"]
    networks: {syntraf_lab: {ipv4_address: 172.30.0.32}}

  c3:
    <<: [*syntraf, *client-depends]
    container_name: syntraf-lab-c3
    environment: {ROLE: client, CLIENT_UID: LAB_C3}
    volumes: ["../:/src:ro", "./reports/logs/c3:/logs", "c3-crypto:/app/crypto"]
    networks: {syntraf_lab: {ipv4_address: 172.30.0.33}}

  c4:
    <<: [*syntraf, *client-depends]
    container_name: syntraf-lab-c4
    # Derrière le routeur NAT starlink-gw : aucune connexion entrante possible (BEHIND_NAT dans server.toml)
    environment: {ROLE: client, CLIENT_UID: STARLINK, LAB_GATEWAY: 10.99.0.2}
    volumes: ["../:/src:ro", "./reports/logs/c4:/logs", "c4-crypto:/app/crypto"]
    networks: {starlink_lan: {ipv4_address: 10.99.0.34}}
    depends_on:
      server:
        condition: service_started
      starlink-gw:
        condition: service_started

  starlink-gw:
    # Routeur NAT (masquerade) du site STARLINK : LAN 10.99.0.0/24 → réseau du lab
    image: syntraf-lab:latest
    container_name: syntraf-lab-starlink-gw
    restart: "no"
    init: true
    mem_limit: 32m
    cap_add: [NET_ADMIN]
    sysctls: {net.ipv4.ip_forward: 1}
    entrypoint: ["sh", "-c", "iptables -t nat -A POSTROUTING -s 10.99.0.0/24 ! -d 10.99.0.0/24 -j MASQUERADE && exec sleep infinity"]
    networks:
      syntraf_lab: {ipv4_address: 172.30.0.35}
      starlink_lan: {ipv4_address: 10.99.0.2}

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION}
    container_name: syntraf-lab-grafana
    restart: "no"
    init: true
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/syntraf.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      TZ: UTC
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT}:3000"
    depends_on:
      victoriametrics:
        condition: service_healthy
    networks:
      syntraf_lab:
        ipv4_address: 172.30.0.40

volumes:
  vm-data:
  # clés et certificats de SYNTRAF (serveur, clients) : gardés d'un redémarrage à l'autre
  server-crypto:
  c1-crypto:
  c2-crypto:
  c3-crypto:
  c4-crypto:

networks:
  syntraf_lab:
    name: syntraf_lab
    ipam:
      config:
        - subnet: 172.30.0.0/24
  starlink_lan:
    name: syntraf_starlink_lan
    # Pas « internal » : Docker y jetterait tout paquet vers une autre destination que le LAN, même routé par
    # starlink-gw. L'isolement entre réseaux Docker empêche les autres nœuds de joindre STARLINK directement.
    ipam:
      config:
        - subnet: 10.99.0.0/24
