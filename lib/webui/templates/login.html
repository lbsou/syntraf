<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap5/bootswatch_darkly_5.min.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/st_app.css')}}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="{{ url_for('static', filename='js/st_i18n.js')}}" data-dict="{{ url_for('static', filename='i18n/') }}"></script>
    <title>Sign in · SYNTRAF</title>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh">
<main class="st-card" style="width: 22rem">
    <h1 class="h4 mb-3">SYNTRAF</h1>
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
            <label for="username" class="form-label">User name</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
</main>
</body>
</html>
