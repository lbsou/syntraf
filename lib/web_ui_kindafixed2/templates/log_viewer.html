{% extends "base.html" %}
{% block title %}Log viewer{% endblock %}
{% block head %}
<style>
    .logging_window{
        display: block;
        padding: 9.5px;
        font-size: 13px;
        line-height: 1.42857143;
        color: #333;
        word-break: break-all;
        word-wrap: break-word;
        background-color: #f5f5f5;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 50%;
        margin: auto;
    }
</style>

{% endblock %}

{% block content %}
<h2>Log viewer</h2>

<div class="content-wrapper">
   <div class="form-group w-50">
      <form>
           <select class="custom-select" name="log_filename" id="log_filename" onchange="read_log()"></select>
      </form>
   </div>
</div>

    <div class="row">
        <div class="logging_window">
            <pre id="output"></pre>
        </div>
    </div>

<script type="text/javascript">
    window.addEventListener("load", get_log_filename);

    /*
    Use onload to populate the list of logs filename
    it use the api to get that list
    */
    async function get_log_filename()
    {
        const response = await fetch('/api?getlogfilename');
        const select = document.getElementById("log_filename");
        select.replaceChildren();
        for (const filename of await response.json()) {
            select.add(new Option(filename, filename));
        }
        if (select.options.length) read_log();
    }

    async function read_log()
    {
        const name = document.getElementById("log_filename").value;
        const response = await fetch('/api?readlog&file=' + encodeURIComponent(name));
        const output = document.getElementById('output');
        output.textContent = await response.text();
        output.scrollIntoView({block: "end"});
    }
</script>

{% endblock %}
