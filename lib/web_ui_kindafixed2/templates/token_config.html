{% extends "base.html" %}
{% block title %}Token{% endblock %}
{% block content %}
<h2>Token configuration</h2>
<br/>
    <table id="table_tokens" class="table table-striped table-hover table-sm">
        <thead>
            <th style="width: 50%">DESCRIPTION</th>
            <th style="width: 50%">TOKEN</th>
        </thead>
        <tbody id="table_tokens_body">
        </tbody>
    </table>

<script>
// Le tableau est rempli à la main : la page utilisait l'API DataTables, qui n'est plus chargée depuis le passage
// à bootstrap-table (2022), et le tableau restait vide.
window.addEventListener('load', get_tokens);

async function get_tokens()
{
    const fd = new FormData();
    fd.append('ACTION', "GET_TOKENS");
    const response = await fetch('/api', {method: 'POST', body: fd});
    const tokens = await response.json();
    const body = document.getElementById('table_tokens_body');
    body.replaceChildren();
    for (const [description, token] of Object.entries(tokens)) {
        const tr = body.insertRow();
        tr.insertCell().textContent = description;
        tr.insertCell().textContent = token;
    }
}
</script>

{% endblock %}
