{% extends "base.html" %}
{% block title %}{{ _('global_config.title') }}{% endblock %}
{% block content %}
<div class="mb-3">
    <h2><i class="fas fa-globe"></i> {{ _('global_config.title') }}</h2>
</div>

<div class="card">
    <div class="card-header">
        <i class="fas fa-cog"></i> {{ _('common.settings') }}
    </div>
    <div class="card-body">
        <form id="global_config_form">
            <!-- iperf3 Settings -->
            <h5 class="text-info mb-3"><i class="fas fa-tachometer-alt"></i> {{ _('global_config.iperf3_settings') }}</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="iperf3_binary_path" class="form-label">{{ _('global_config.iperf3_path') }}</label>
                    <input type="text" class="form-control" id="iperf3_binary_path"
                           value="{{ config['GLOBAL'].get('IPERF3_BINARY_PATH', '') }}"
                           placeholder="/usr/bin/iperf3 or C:\iperf3\iperf3.exe">
                </div>
                <div class="col-md-6">
                    <label for="iperf3_time_skew_threshold" class="form-label">{{ _('global_config.time_skew') }}</label>
                    <input type="number" class="form-control" id="iperf3_time_skew_threshold"
                           value="{{ config['GLOBAL'].get('IPERF3_TIME_SKEW_THRESHOLD', '300') }}"
                           min="0" max="3600">
                </div>
            </div>

            <hr class="my-4">

            <!-- Logging Settings -->
            <h5 class="text-info mb-3"><i class="fas fa-file-alt"></i> {{ _('global_config.logging_settings') }}</h5>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="log_to" class="form-label">{{ _('global_config.log_output') }}</label>
                    <select class="form-select" id="log_to">
                        <option value="file" {% if config['GLOBAL'].get('LOG_TO', 'file') == 'file' %}selected{% endif %}>File</option>
                        <option value="stdout" {% if config['GLOBAL'].get('LOG_TO', 'file') == 'stdout' %}selected{% endif %}>Stdout</option>
                        <option value="both" {% if config['GLOBAL'].get('LOG_TO', 'file') == 'both' %}selected{% endif %}>Both</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="log_level" class="form-label">{{ _('global_config.log_level') }}</label>
                    <select class="form-select" id="log_level">
                        <option value="DEBUG" {% if config['GLOBAL'].get('LOG_LEVEL', 'WARNING') == 'DEBUG' %}selected{% endif %}>{{ _('global_config.log_levels.debug') }}</option>
                        <option value="INFO" {% if config['GLOBAL'].get('LOG_LEVEL', 'WARNING') == 'INFO' %}selected{% endif %}>{{ _('global_config.log_levels.info') }}</option>
                        <option value="WARNING" {% if config['GLOBAL'].get('LOG_LEVEL', 'WARNING') == 'WARNING' %}selected{% endif %}>{{ _('global_config.log_levels.warning') }}</option>
                        <option value="ERROR" {% if config['GLOBAL'].get('LOG_LEVEL', 'WARNING') == 'ERROR' %}selected{% endif %}>{{ _('global_config.log_levels.error') }}</option>
                        <option value="CRITICAL" {% if config['GLOBAL'].get('LOG_LEVEL', 'WARNING') == 'CRITICAL' %}selected{% endif %}>{{ _('global_config.log_levels.critical') }}</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="watchdog_check_rate" class="form-label">{{ _('global_config.watchdog_rate') }}</label>
                    <input type="number" class="form-control" id="watchdog_check_rate"
                           value="{{ config['GLOBAL'].get('WATCHDOG_CHECK_RATE', '2') }}"
                           min="1" max="60">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="log_max_size_per_file_mb" class="form-label">{{ _('global_config.max_log_size') }}</label>
                    <input type="number" class="form-control" id="log_max_size_per_file_mb"
                           value="{{ config['GLOBAL'].get('LOG_MAX_SIZE_PER_FILE_MB', '10') }}"
                           min="1" max="1000">
                </div>
                <div class="col-md-6">
                    <label for="log_file_to_keep" class="form-label">{{ _('global_config.log_files_keep') }}</label>
                    <input type="number" class="form-control" id="log_file_to_keep"
                           value="{{ config['GLOBAL'].get('LOG_FILE_TO_KEEP', '1') }}"
                           min="1" max="100">
                </div>
            </div>

            <hr class="my-4">

            <!-- Save Button -->
            <div class="d-flex justify-content-start">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ _('global_config.save_config') }}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const globalConfigI18n = {
    saveSuccess: "{{ _('global_config.save_success') }}",
    saveError: "{{ _('global_config.save_error') }}",
    error: "{{ _('common.error') }}"
};

document.getElementById('global_config_form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const fd = new FormData();
    fd.append('ACTION', 'SAVE_GLOBAL_CONFIG');
    fd.append('IPERF3_BINARY_PATH', document.getElementById('iperf3_binary_path').value);
    fd.append('IPERF3_TIME_SKEW_THRESHOLD', document.getElementById('iperf3_time_skew_threshold').value);
    fd.append('LOG_TO', document.getElementById('log_to').value);
    fd.append('LOG_LEVEL', document.getElementById('log_level').value);
    fd.append('LOG_MAX_SIZE_PER_FILE_MB', document.getElementById('log_max_size_per_file_mb').value);
    fd.append('LOG_FILE_TO_KEEP', document.getElementById('log_file_to_keep').value);
    fd.append('WATCHDOG_CHECK_RATE', document.getElementById('watchdog_check_rate').value);

    try {
        const response = await fetch('/api', {
            method: 'POST',
            body: fd
        });

        const result = await response.json();

        if (result.status === 'OK') {
            showAlert(globalConfigI18n.saveSuccess, 'success');
        } else {
            showAlert(globalConfigI18n.error + ': ' + result.message, 'danger');
        }
    } catch (error) {
        console.error('Error saving config:', error);
        showAlert(globalConfigI18n.saveError, 'danger');
    }
});
</script>

{% endblock %}
